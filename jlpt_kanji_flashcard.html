<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT Kanji Flashcard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --border: #e0ddd6;
    --border-hover: #c5c2bb;
    --text: #1a1917;
    --text-muted: #6b6860;
    --text-hint: #a8a59e;
    --green: #1D9E75;
    --green-bg: #e1f5ee;
    --red: #D85A30;
    --red-bg: #faece7;
    --accent: #3c3a35;
    --tag-bg: #eeecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181a;
      --surface: #232326;
      --border: #38383c;
      --border-hover: #505055;
      --text: #f0eeea;
      --text-muted: #9a9895;
      --text-hint: #606060;
      --green: #3ecfa0;
      --green-bg: #0d2e22;
      --red: #f0795a;
      --red-bg: #2e1510;
      --accent: #c8c5be;
      --tag-bg: #2a2a2e;
    }
  }
  body {
    font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
    text-transform: uppercase;
    font-size: 12px;
  }
  .controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 0.75rem;
  }
  .level-btn {
    padding: 6px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .level-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .level-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .mode-row {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .mode-btn {
    padding: 4px 12px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .mode-btn.active { background: var(--tag-bg); color: var(--text); border-color: var(--border-hover); }
  .card-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    width: 100%;
    max-width: 380px;
  }
  .progress-bar {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .score-row {
    display: flex;
    gap: 1.5rem;
    font-size: 13px;
    color: var(--text-muted);
  }
  .score-item { display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .flashcard {
    width: 100%;
    min-height: 240px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 2.5rem 2rem;
    position: relative;
    transition: border-color 0.15s, transform 0.1s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .flashcard:hover { border-color: var(--border-hover); }
  .flashcard:active { transform: scale(0.99); }
  .level-tag {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 100px;
    background: var(--tag-bg);
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }
  .kanji-char {
    font-size: 96px;
    line-height: 1;
    margin-bottom: 0.75rem;
    font-weight: 400;
  }
  .card-hint {
    font-size: 12px;
    color: var(--text-hint);
  }
  .card-answer { text-align: center; margin-top: 0.25rem; }
  .reading { font-size: 20px; font-weight: 500; color: var(--text); letter-spacing: 0.02em; }
  .meaning { font-size: 14px; color: var(--text-muted); margin-top: 6px; }
  .actions { display: flex; gap: 10px; }
  .btn {
    padding: 10px 24px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    min-width: 90px;
  }
  .btn:hover { border-color: var(--border-hover); }
  .btn:active { transform: scale(0.97); }
  .btn.correct { border-color: var(--green); color: var(--green); }
  .btn.correct:hover { background: var(--green-bg); }
  .btn.wrong { border-color: var(--red); color: var(--red); }
  .btn.wrong:hover { background: var(--red-bg); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { opacity: 0.85; }
  .stats-label { font-size: 12px; color: var(--text-hint); }
</style>
</head>
<body>

<h1>JLPT Kanji Flashcard</h1>

<div class="controls">
  <button class="level-btn active" onclick="setLevel('all',this)">Tất cả</button>
  <button class="level-btn" onclick="setLevel('N5',this)">N5</button>
  <button class="level-btn" onclick="setLevel('N4',this)">N4</button>
  <button class="level-btn" onclick="setLevel('N3',this)">N3</button>
  <button class="level-btn" onclick="setLevel('N2',this)">N2</button>
  <button class="level-btn" onclick="setLevel('N1',this)">N1</button>
</div>

<div class="mode-row">
  <button class="mode-btn active" onclick="setMode('random','mode-random')" id="mode-random">Ngẫu nhiên</button>
  <button class="mode-btn" onclick="setMode('weak','mode-weak')" id="mode-weak">Ôn yếu</button>
  <button class="mode-btn" onclick="setMode('unseen','mode-unseen')" id="mode-unseen">Chưa học</button>
</div>

<div class="card-wrap">
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>

  <div class="score-row">
    <div class="score-item"><div class="dot" style="background:var(--green)"></div><span id="correct-cnt">0</span> đúng</div>
    <div class="score-item"><div class="dot" style="background:var(--red)"></div><span id="wrong-cnt">0</span> sai</div>
    <div class="score-item"><div class="dot" style="background:var(--border-hover)"></div><span id="skip-cnt">0</span> bỏ qua</div>
    <span class="stats-label" id="stats-text"></span>
  </div>

  <div class="flashcard" id="card" onclick="revealCard()">
    <span class="level-tag" id="card-level"></span>
    <div class="kanji-char" id="card-kanji">？</div>
    <div id="card-answer" class="card-answer" style="display:none">
      <div class="reading" id="card-reading"></div>
      <div class="meaning" id="card-meaning"></div>
    </div>
    <div class="card-hint" id="card-hint">Nhấn để xem đáp án</div>
  </div>

  <div class="actions" id="action-btns" style="display:none">
    <button class="btn wrong" onclick="markCard(false)">✗ Sai</button>
    <button class="btn" onclick="nextCard()">→ Bỏ qua</button>
    <button class="btn correct" onclick="markCard(true)">✓ Đúng</button>
  </div>
  <div class="actions" id="next-btn">
    <button class="btn primary" onclick="revealCard()" id="main-action-btn">Bắt đầu</button>
  </div>
</div>

  "酒":"さけ・しゅ / alcohol","光":"ひかり・こう / light","当":"あた・とう / hit, apply","社":"しゃ / company, shrine","道":"みち・どう / road","星":"ほし・せい / star","文":"ふみ・ぶん / text","場":"ば・じょう / place","様":"さま・よう / manner","会":"あ・かい / meet","県":"けん / prefecture","広":"ひろ・こう / wide","売":"う・ばい / sell","運":"はこ・うん / luck, carry","動":"うご・どう / move","家":"いえ・か / house","理":"り / reason","野":"の・や / field","都":"みやこ・と / capital","店":"みせ・てん / shop","歌":"うた・か / song","英":"えい / England","知":"し・ち / know","医":"い / medicine","病":"や・びょう / illness","夜":"よる・や / night","数":"かず・すう / number","味":"あじ・み / taste","集":"あつ・しゅう / gather","旅":"たび・りょ / travel","真":"ま・しん / true","歩":"ある・ほ / walk","朝":"あさ・ちょう / morning","色":"いろ・しょく / color","利":"り / benefit","秋":"あき・しゅう / autumn","題":"だい / subject","走":"はし・そう / run","正":"ただ・せい / correct","村":"むら・そん / village","教":"おし・きょう / teach","考":"かんが・こう / think","計":"けい / calculate","遠":"とお・えん / far","図":"ず / map","同":"おな・どう / same","思":"おも・し / think","春":"はる・しゅん / spring","短":"みじか・たん / short","馬":"うま・ば / horse","世":"よ・せい / world","室":"しつ / room","屋":"や・おく / shop, roof","速":"はや・そく / fast","衣":"ころも・い / clothing","駅":"えき / station","楽":"たの・がく / fun, music","薬":"くすり・やく / medicine","品":"しな・ひん / goods","強":"つよ・きょう / strong","弱":"よわ・じゃく / weak","声":"こえ・せい / voice","船":"ふね・せん / ship","緑":"みどり・りょく / green","冬":"ふゆ・とう / winter","終":"お・しゅう / end","市":"し / city","急":"きゅう / urgent","発":"はつ / depart","試":"ため・し / try, test","鉄":"てつ / iron","育":"そだ・いく / raise, grow"
};

const levels = ['N5','N4','N3','N2','N1'];
let currentLevel = 'all';
let currentMode = 'random';
let deck = [], cardIndex = 0, revealed = false;
let correctCount = 0, wrongCount = 0, skipCount = 0;
let seen = new Set(), wrong = new Set(), sessionTotal = 0;

function getAllKanji() {
  if (currentLevel === 'all') return levels.flatMap(l => kanjiData[l]);
  return kanjiData[currentLevel] || [];
}
function buildDeck() {
  let all = getAllKanji();
  if (currentMode === 'weak') { let w = [...wrong]; all = w.length ? w : all; }
  else if (currentMode === 'unseen') { let u = all.filter(k => !seen.has(k)); all = u.length ? u : all; }
  deck = shuffle([...all]);
  cardIndex = 0; sessionTotal = deck.length;
}
function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function setLevel(lvl, btn) {
  currentLevel = lvl;
  document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  resetSession();
}
function setMode(m, id) {
  currentMode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  resetSession();
}
function resetSession() {
  correctCount = 0; wrongCount = 0; skipCount = 0; revealed = false;
  buildDeck(); showCard(); updateStats();
}
function showCard() {
  if (!deck.length) buildDeck();
  const k = deck[cardIndex];
  document.getElementById('card-kanji').textContent = k;
  document.getElementById('card-level').textContent = getLevelOf(k);
  document.getElementById('card-answer').style.display = 'none';
  document.getElementById('card-hint').style.display = 'block';
  document.getElementById('action-btns').style.display = 'none';
  document.getElementById('next-btn').style.display = 'flex';
  document.getElementById('main-action-btn').textContent = 'Xem đáp án';
  revealed = false; seen.add(k);
  updateProgress(); updateStats();
}
function getLevelOf(k) {
  for (const l of levels) { if (kanjiData[l].includes(k)) return l; } return '';
}
function revealCard() {
  if (revealed) return;
  const k = deck[cardIndex];
  const info = readings[k];
  let reading = '', meaning = '';
  if (info) { const p = info.split(' / '); reading = p[0]; meaning = p[1] || ''; }
  document.getElementById('card-reading').textContent = reading || '（tra từ điển để biết thêm）';
  document.getElementById('card-meaning').textContent = meaning;
  document.getElementById('card-answer').style.display = 'block';
  document.getElementById('card-hint').style.display = 'none';
  document.getElementById('action-btns').style.display = 'flex';
  document.getElementById('next-btn').style.display = 'none';
  revealed = true;
}
function markCard(correct) {
  const k = deck[cardIndex];
  if (correct) { correctCount++; wrong.delete(k); } else { wrongCount++; wrong.add(k); }
  nextCard();
}
function nextCard() {
  if (!revealed) skipCount++;
  cardIndex = (cardIndex + 1) % deck.length;
  showCard();
}
function updateProgress() {
  document.getElementById('prog').style.width = (sessionTotal ? Math.round(cardIndex/sessionTotal*100) : 0) + '%';
}
function updateStats() {
  document.getElementById('stats-text').textContent = getAllKanji().length + ' kanji';
  document.getElementById('correct-cnt').textContent = correctCount;
  document.getElementById('wrong-cnt').textContent = wrongCount;
  document.getElementById('skip-cnt').textContent = skipCount;
}

buildDeck(); showCard();
</script>
